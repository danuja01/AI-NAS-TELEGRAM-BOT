services:
  nas-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nas-telegram-bot
    restart: unless-stopped
    privileged: true
    pid: host

    # Environment variables (alternative to .env file)
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-5.4-nano}
      - THINKING_MODEL=${THINKING_MODEL:-o3}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-gpt-5.4-mini}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ROOT_PASSWORD=${ROOT_PASSWORD:-}
      - DOCUMENT_PATH=${DOCUMENT_PATH:-/app/documents}
      - ALLOWED_PATHS=${ALLOWED_PATHS:-/app/documents,/app/data}
      - DATABASE_PATH=/app/data/bot.db
      - CHROMA_PATH=/app/data/chroma_db
      - LOG_FILE=/app/logs/bot.log
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONVERSATION_HISTORY_LENGTH=${CONVERSATION_HISTORY_LENGTH:-10}
      - HOST_EXEC_MODE=${HOST_EXEC_MODE:-nsenter}
      - HOST_NSENTER_PID=${HOST_NSENTER_PID:-1}
      - HOST_SSH=${HOST_SSH:-}
      - HOST_SSH_EXTRA_ARGS=${HOST_SSH_EXTRA_ARGS:-}
      - HOST_EXEC_TIMEOUT_SHORT=${HOST_EXEC_TIMEOUT_SHORT:-300}
      - HOST_EXEC_TIMEOUT_LONG=${HOST_EXEC_TIMEOUT_LONG:-3600}
      - MAINTENANCE_ALLOWED_USER_IDS=${MAINTENANCE_ALLOWED_USER_IDS:-}
      - MONITOR_SYSTEMD_UNITS=${MONITOR_SYSTEMD_UNITS:-docker,smbd,nginx}
      - JOURNAL_TAIL_LINES=${JOURNAL_TAIL_LINES:-20}
      - JOURNAL_ALERT_COOLDOWN_SECONDS=${JOURNAL_ALERT_COOLDOWN_SECONDS:-600}
      - CRON_NOTIFY_SECRET=${CRON_NOTIFY_SECRET:-}
      - CRON_NOTIFY_BIND=${CRON_NOTIFY_BIND:-127.0.0.1}
      - CRON_NOTIFY_PORT=${CRON_NOTIFY_PORT:-18765}
      - METRICS_SAMPLE_INTERVAL_MINUTES=${METRICS_SAMPLE_INTERVAL_MINUTES:-15}
      - DIGEST_INTERVAL_HOURS=${DIGEST_INTERVAL_HOURS:-24}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-5}
      # Re-index RAG docs after each container start + notify ALLOWED_USER_IDS on Telegram
      - AUTO_INDEX_ON_START=${AUTO_INDEX_ON_START:-true}
      - AUTO_INDEX_FORCE_REINDEX=${AUTO_INDEX_FORCE_REINDEX:-false}

    # Mount volumes for persistent data
    volumes:
      # Data directory (database, chroma, etc.)
      - ./data:/app/data
      # Logs directory
      - ./logs:/app/logs
      # Documents directory (for RAG) - read-write for uploads
      - ${DOCUMENT_PATH:-./documents}:/app/documents
      # NAS disk mount (entire disk for /cd root access)
      - /srv/dev-disk-by-uuid-9ac22f70-05c6-442f-993b-0d9ca1ae5988:/srv/dev-disk-by-uuid-9ac22f70-05c6-442f-993b-0d9ca1ae5988
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Mount .env file
      - ./.env:/app/.env:ro

    # Optional: Network configuration
    # networks:
    #   - nas-network

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Define custom network
# networks:
#   nas-network:
#     driver: bridge
