# Smoke-test Docker build on pull requests to main.
# Pushes to `main` run the same build inside "Deploy to NAS" (smoke job) before deploy.
name: Docker Image CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag nas-telegram-bot:${{ github.event_name }}-${{ github.sha }}
